<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>만 나이 계산기 - 만 나이, 연 나이, 띠, 생일까지 남은 날</title>
<meta name="description" content="생년월일만 넣으면 오늘 기준 만 나이, 연 나이, 세는 나이, 띠, 다음 생일까지 남은 날과 살아온 날 수를 계산합니다.">
<meta name="keywords" content="만 나이 계산기, 만나이 계산, 나이 계산기, 연 나이, 띠 계산">
<meta property="og:title" content="만 나이 계산기 - 만 나이, 연 나이, 띠, 생일까지 남은 날">
<meta property="og:description" content="생년월일만 넣으면 오늘 기준 만 나이, 연 나이, 세는 나이, 띠, 다음 생일까지 남은 날과 살아온 날 수를 계산합니다.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jjang12.github.io/age/">
<link rel="canonical" href="https://jjang12.github.io/age/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/site.css">

</head>
<body data-blog="kkultiplab">
<main>
<h1>만 나이 계산기</h1>
<p class="lead">생년월일을 넣으면 기준일의 만 나이와 연 나이, 띠, 다음 생일까지 남은 날을 계산합니다.</p>
<div class="row">
  <div class="field"><label for="birth">생년월일</label><input id="birth" type="date" value="1990-01-01"></div>
  <div class="field"><label for="ref">기준일</label><input id="ref" type="date"></div>
</div>
<div class="panel"><div class="big" id="main"></div><div class="note" id="sub" style="margin-top:6px"></div></div>
<table class="kv" id="tbl"></table>
<h2>나이 기준 안내</h2>
<div class="note">
  <p>2023년 6월 28일부터 법령·계약·공문서의 나이는 만 나이로 통일됐습니다. 만 나이는 생일이 지나야 한 살 늘어납니다.</p>
  <p>연 나이는 「기준 연도 - 출생 연도」로, 청소년보호법·병역법 등 일부 법에서 씁니다. 세는 나이는 연 나이에 1을 더한 옛 방식입니다.</p>
  <p>띠는 양력 출생 연도 기준입니다. 엄밀히는 음력 설날을 기준으로 바뀌므로 1~2월생은 앞 해의 띠일 수 있습니다.</p>
</div>
</main>
<script src="/assets/site.js"></script>
<script>
const ANIMALS = ['원숭이','닭','개','돼지','쥐','소','호랑이','토끼','용','뱀','말','양'];
const toUTC = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d); };
const DAY = 86400000;
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
// 생일(월·일)을 해당 연도에 맞춤: 2월 29일생은 평년에 3월 1일로 처리
const bdayIn = (y, m, d) => (m === 2 && d === 29 && !isLeap(y)) ? Date.UTC(y, 2, 1) : Date.UTC(y, m-1, d);
const today = new Date(); $('ref').value = new Date(today.getTime() - today.getTimezoneOffset()*60000).toISOString().slice(0,10);
function calc(){
  if (!$('birth').value || !$('ref').value) return;
  const [by, bm, bd] = $('birth').value.split('-').map(Number);
  const ref = toUTC($('ref').value), birth = toUTC($('birth').value);
  const ry = new Date(ref).getUTCFullYear();
  if (ref < birth){ $('main').textContent = '기준일이 생년월일보다 앞입니다.'; $('sub').textContent=''; $('tbl').innerHTML=''; return; }
  let age = ry - by; if (ref < bdayIn(ry, bm, bd)) age--;
  let next = bdayIn(ry, bm, bd); if (next < ref) next = bdayIn(ry + 1, bm, bd);
  const dleft = Math.round((next - ref) / DAY);
  const lived = Math.round((ref - birth) / DAY) + 1;
  $('main').innerHTML = `만 ${age}세`;
  $('sub').textContent = dleft === 0 ? '오늘이 생일입니다.' : `다음 생일까지 ${fmt(dleft)}일`;
  $('tbl').innerHTML = [
    ['만 나이', `${age}세`], ['연 나이', `${ry - by}세`], ['세는 나이 (옛 방식)', `${ry - by + 1}세`],
    ['띠', `${ANIMALS[by % 12]}띠`], ['다음 생일', `${new Date(next).toISOString().slice(0,10)} (D-${dleft})`],
    ['태어난 날부터 (태어난 날 1일)', `${fmt(lived)}일째`],
  ].map(([k,v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('');
}
['birth','ref'].forEach(id => $(id).addEventListener('input', calc));
calc();
</script>
</body>
</html>
