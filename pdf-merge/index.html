<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF 합치기 - 여러 PDF를 하나로 무료 병합</title>
<meta name="description" content="PDF 파일 여러 개를 원하는 순서대로 하나로 합칩니다. 용량·개수 제한 없이 무료, 파일은 서버로 전송되지 않고 내 기기에서만 처리됩니다.">
<meta name="keywords" content="pdf 합치기, pdf 병합, pdf 하나로 합치기, pdf merge, 무료 pdf 합치기">
<meta property="og:title" content="PDF 합치기 - 여러 PDF를 하나로 무료 병합">
<meta property="og:description" content="PDF 파일 여러 개를 원하는 순서대로 하나로 합칩니다. 용량·개수 제한 없이 무료, 파일은 서버로 전송되지 않고 내 기기에서만 처리됩니다.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jjang12.github.io/pdf-merge/">
<link rel="canonical" href="https://jjang12.github.io/pdf-merge/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/site.css">

</head>
<body data-blog="jisik_plus">
<main>
<h1>PDF 합치기</h1>
<p class="lead">PDF 여러 개를 원하는 순서대로 하나로 합칩니다. 계약서나 증빙 서류처럼 민감한 문서도 서버로 올라가지 않습니다.</p>
<label class="drop" id="drop"><input type="file" accept="application/pdf,.pdf" multiple><b>PDF를 끌어다 놓거나 눌러서 선택</b><span>화살표로 순서를 바꿀 수 있습니다.</span></label>
<ul class="flist" id="list"></ul>
<div class="btns"><button type="button" class="btn" id="run" disabled>PDF 합치기</button><button type="button" class="btn sub" id="reset">목록 비우기</button></div>
<p class="note" id="status"></p>
<h2>사용 안내</h2>
<div class="note"><p>파일은 서버로 올라가지 않고 이 브라우저 안에서만 변환됩니다. 인터넷이 끊겨도 페이지가 열려 있으면 동작합니다.</p><p>비밀번호가 걸린 PDF는 합칠 수 없습니다. 비밀번호를 해제한 파일을 넣어 주세요.</p></div>
</main>
<script src="/assets/site.js"></script>
<script src="/assets/vendor/pdf-lib.min.js"></script>
<script>
function moveItem(arr, i, d){ const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }
function renderOrder(){
  $('list').innerHTML = files.map((f, i) => `<li><span class="meta">${i + 1}</span><span class="nm">${f.name.replace(/</g,'&lt;')}</span><span class="meta">${fmtBytes(f.size)}</span>
    <button type="button" data-a="up" data-i="${i}" aria-label="위로">↑</button><button type="button" data-a="down" data-i="${i}" aria-label="아래로">↓</button><button type="button" data-a="del" data-i="${i}" aria-label="삭제">✕</button></li>`).join('');
  $('run').disabled = !files.length;
}
$('list').onclick = e => { const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.i;
  if (b.dataset.a === 'up') moveItem(files, i, -1); else if (b.dataset.a === 'down') moveItem(files, i, 1); else files.splice(i, 1); renderOrder(); };
$('reset').onclick = () => { files = []; renderOrder(); };
let files = [];
bindDrop($('drop'), fs => { files.push(...fs.filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name))); renderOrder(); });
$('run').onclick = async () => {
  $('run').disabled = true;
  const {PDFDocument} = PDFLib, out = await PDFDocument.create();
  let pages = 0;
  for (let i = 0; i < files.length; i++){
    $('status').textContent = `${i + 1} / ${files.length} 합치는 중`;
    try {
      const src = await PDFDocument.load(await files[i].arrayBuffer());
      const copied = await out.copyPages(src, src.getPageIndices());
      copied.forEach(p => out.addPage(p)); pages += copied.length;
    } catch (e) {
      $('status').textContent = `「${files[i].name}」을 읽지 못했습니다. 비밀번호가 걸렸거나 손상된 파일입니다.`;
      $('run').disabled = false; return;
    }
  }
  const bytes = await out.save();
  saveBlob(new Blob([bytes], {type: 'application/pdf'}), 'merged.pdf');
  $('status').textContent = `${files.length}개 파일, 총 ${pages}쪽 (${fmtBytes(bytes.length)})을 합쳤습니다.`;
  $('run').disabled = false;
};
</script>
</body>
</html>
