<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이미지 PDF 변환 - JPG PNG 여러 장을 PDF 하나로</title>
<meta name="description" content="사진·스캔 이미지 여러 장을 원하는 순서대로 PDF 하나로 만듭니다. A4 맞춤 또는 원본 크기 선택, 파일은 서버로 전송되지 않습니다.">
<meta name="keywords" content="이미지 pdf 변환, jpg pdf 변환, 사진 pdf 만들기, png pdf 변환, 여러 이미지 pdf">
<meta property="og:title" content="이미지 PDF 변환 - JPG PNG 여러 장을 PDF 하나로">
<meta property="og:description" content="사진·스캔 이미지 여러 장을 원하는 순서대로 PDF 하나로 만듭니다. A4 맞춤 또는 원본 크기 선택, 파일은 서버로 전송되지 않습니다.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jjang12.github.io/img2pdf/">
<link rel="canonical" href="https://jjang12.github.io/img2pdf/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/site.css">

</head>
<body data-blog="jisik_plus">
<main>
<h1>이미지 PDF 변환</h1>
<p class="lead">사진이나 스캔 이미지 여러 장을 원하는 순서대로 PDF 하나로 만듭니다.</p>
<label class="drop" id="drop"><input type="file" accept="image/*" multiple><b>이미지를 끌어다 놓거나 눌러서 선택</b><span>JPG, PNG, WEBP 등. 화살표로 순서를 바꿀 수 있습니다.</span></label>
<div class="row" style="margin-top:16px">
  <div class="field"><label for="size">페이지 크기</label><select id="size"><option value="a4">A4 (이미지 방향에 맞춤)</option><option value="a4p">A4 세로 고정</option><option value="img">이미지 크기 그대로</option></select></div>
  <div class="field"><label for="margin">여백</label><select id="margin"><option value="20">좁게</option><option value="0">없음</option><option value="40">넓게</option></select></div>
</div>
<ul class="flist" id="list"></ul>
<div class="btns"><button type="button" class="btn" id="run" disabled>PDF 만들기</button><button type="button" class="btn sub" id="reset">목록 비우기</button></div>
<p class="note" id="status"></p>
<h2>사용 안내</h2>
<div class="note"><p>파일은 서버로 올라가지 않고 이 브라우저 안에서만 변환됩니다. 인터넷이 끊겨도 페이지가 열려 있으면 동작합니다.</p><p>긴 변이 3,000픽셀보다 큰 이미지는 3,000픽셀로 줄여 넣어 PDF 용량이 지나치게 커지지 않게 합니다.</p></div>
</main>
<script src="/assets/site.js"></script>
<script src="/assets/vendor/pdf-lib.min.js"></script>
<script>
function moveItem(arr, i, d){ const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; }
function renderOrder(){
  $('list').innerHTML = files.map((f, i) => `<li><span class="meta">${i + 1}</span><span class="nm">${f.name.replace(/</g,'&lt;')}</span><span class="meta">${fmtBytes(f.size)}</span>
    <button type="button" data-a="up" data-i="${i}" aria-label="위로">↑</button><button type="button" data-a="down" data-i="${i}" aria-label="아래로">↓</button><button type="button" data-a="del" data-i="${i}" aria-label="삭제">✕</button></li>`).join('');
  $('run').disabled = !files.length;
}
$('list').onclick = e => { const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.i;
  if (b.dataset.a === 'up') moveItem(files, i, -1); else if (b.dataset.a === 'down') moveItem(files, i, 1); else files.splice(i, 1); renderOrder(); };
$('reset').onclick = () => { files = []; renderOrder(); };
let files = [];
bindDrop($('drop'), fs => { files.push(...fs.filter(f => f.type.startsWith('image/'))); renderOrder(); });
async function toJpeg(file){
  const img = await createImageBitmap(file);
  let w = img.width, h = img.height; const M = 3000;
  if (Math.max(w, h) > M){ const r = M / Math.max(w, h); w = Math.round(w * r); h = Math.round(h * r); }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
  return {bytes: new Uint8Array(await blob.arrayBuffer()), w, h};
}
$('run').onclick = async () => {
  $('run').disabled = true;
  const {PDFDocument} = PDFLib, doc = await PDFDocument.create();
  const mode = $('size').value, m = +$('margin').value, A4 = [595.28, 841.89];
  try {
    for (let i = 0; i < files.length; i++){
      $('status').textContent = `${i + 1} / ${files.length} 처리 중`;
      const {bytes, w, h} = await toJpeg(files[i]);
      const jpg = await doc.embedJpg(bytes);
      let pw, ph;
      if (mode === 'img'){ pw = w * 0.75 + m * 2; ph = h * 0.75 + m * 2; }
      else if (mode === 'a4' && w > h){ pw = A4[1]; ph = A4[0]; }
      else { pw = A4[0]; ph = A4[1]; }
      const s = Math.min((pw - m * 2) / w, (ph - m * 2) / h);
      const dw = w * s, dh = h * s;
      doc.addPage([pw, ph]).drawImage(jpg, {x: (pw - dw) / 2, y: (ph - dh) / 2, width: dw, height: dh});
    }
    const out = await doc.save();
    saveBlob(new Blob([out], {type: 'application/pdf'}), 'images.pdf');
    $('status').textContent = `${files.length}장, ${fmtBytes(out.length)} PDF를 만들었습니다.`;
  } catch (e) { $('status').textContent = '변환하지 못한 이미지가 있습니다. 해당 파일을 빼고 다시 시도하세요.'; }
  $('run').disabled = false;
};
</script>
</body>
</html>
