<script>
document.querySelectorAll('.syms').forEach(g => g.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const c = b.textContent;
  $('box').value += c;
  toast(await copyText(c) ? `복사했습니다: ${c}` : '복사하지 못했습니다. 모음 칸에서 직접 복사하세요.');
}));
$('copyAll').onclick = async () => { const v = $('box').value; if (!v) return toast('모음 칸이 비어 있습니다.'); toast(await copyText(v) ? `${Array.from(v).length}자를 복사했습니다.` : '복사하지 못했습니다.'); };
$('clear').onclick = () => { $('box').value = ''; $('box').focus(); };
</script>
