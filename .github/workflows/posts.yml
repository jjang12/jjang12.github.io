name: 블로그 최근 글 갱신

on:
  schedule:
    - cron: '17 */4 * * *'   # 4시간마다 (UTC 기준)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 .github/scripts/build_posts.py
      - name: 바뀐 경우에만 커밋
        run: |
          if git diff --quiet -- assets/posts.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/posts.json
          git commit -m 'Update blog posts'
          git push
