name: 환율 갱신

on:
  schedule:
    - cron: '40 0 * * *'   # 매일 09:40 (한국 시간). open.er-api 는 00:00 UTC 쯤 갱신
    - cron: '40 8 * * 1-5' # 평일 17:40 — 유럽중앙은행 기준환율(16:00 CET) 반영
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 .github/scripts/build_rates.py
      - name: 바뀐 경우에만 커밋
        run: |
          if git diff --quiet -- assets/rates.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/rates.json
          git commit -m 'Update exchange rates'
          git pull --rebase
          git push
