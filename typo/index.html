<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한영 타자 변환기 - dkssud을 안녕으로, 한영키 오타 되돌리기</title>
<meta name="description" content="한영키를 안 누르고 친 영어(dkssudgktpdy)를 한글(안녕하세요)로, 한글로 잘못 친 영어(ㅗ디ㅣㅐ)를 영어(hello)로 바꿉니다. 비밀번호 확인에도 유용합니다.">
<meta name="keywords" content="한영 변환기, 한영 타자 변환, 한영키 오타, 영타 한글 변환, dkssud">
<meta property="og:title" content="한영 타자 변환기 - dkssud을 안녕으로, 한영키 오타 되돌리기">
<meta property="og:description" content="한영키를 안 누르고 친 영어(dkssudgktpdy)를 한글(안녕하세요)로, 한글로 잘못 친 영어(ㅗ디ㅣㅐ)를 영어(hello)로 바꿉니다. 비밀번호 확인에도 유용합니다.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jjang12.github.io/typo/">
<link rel="canonical" href="https://jjang12.github.io/typo/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/site.css">

</head>
<body data-blog="jisik_plus">
<main>
<h1>한영 타자 변환기</h1>
<p class="lead">한영키를 잘못 눌러 친 글을 되돌립니다. 영어로 친 한글(dkssud → 안녕)과 한글로 친 영어(ㅗ디ㅣㅐ → hello) 모두 됩니다.</p>
<div class="field"><label for="src">원래 친 글</label><textarea id="src" style="min-height:140px" placeholder="예: dkssudgktpdy"></textarea></div>
<div class="seg" role="group" aria-label="변환 방향">
  <button type="button" data-d="auto" aria-pressed="true">자동</button>
  <button type="button" data-d="e2k" aria-pressed="false">영 → 한</button>
  <button type="button" data-d="k2e" aria-pressed="false">한 → 영</button>
</div>
<div class="field"><label for="out">변환 결과</label><textarea id="out" style="min-height:140px" readonly></textarea></div>
<div class="btns"><button type="button" class="btn" id="copy">결과 복사</button></div>
<h2>사용 안내</h2>
<div class="note">
  <p>두벌식 자판 기준입니다. 쌍자음(ㄲㄸㅃㅆㅉ)과 ㅒ, ㅖ는 Shift를 누른 대문자(R, E, Q, T, W, O, P)로 바뀝니다.</p>
  <p>「자동」은 글에 한글이 섞여 있으면 한 → 영, 없으면 영 → 한으로 바꿉니다.</p>
</div>
</main>
<script src="/assets/site.js"></script>
<script>
const KEY = {r:'ㄱ',R:'ㄲ',s:'ㄴ',e:'ㄷ',E:'ㄸ',f:'ㄹ',a:'ㅁ',q:'ㅂ',Q:'ㅃ',t:'ㅅ',T:'ㅆ',d:'ㅇ',w:'ㅈ',W:'ㅉ',c:'ㅊ',z:'ㅋ',x:'ㅌ',v:'ㅍ',g:'ㅎ',
  k:'ㅏ',o:'ㅐ',i:'ㅑ',O:'ㅒ',j:'ㅓ',p:'ㅔ',u:'ㅕ',P:'ㅖ',h:'ㅗ',y:'ㅛ',n:'ㅜ',b:'ㅠ',m:'ㅡ',l:'ㅣ'};
const REV = Object.fromEntries(Object.entries(KEY).map(([k, v]) => [v, k]));
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const VCOMB = {'ㅗㅏ':'ㅘ','ㅗㅐ':'ㅙ','ㅗㅣ':'ㅚ','ㅜㅓ':'ㅝ','ㅜㅔ':'ㅞ','ㅜㅣ':'ㅟ','ㅡㅣ':'ㅢ'};
const CCOMB = {'ㄱㅅ':'ㄳ','ㄴㅈ':'ㄵ','ㄴㅎ':'ㄶ','ㄹㄱ':'ㄺ','ㄹㅁ':'ㄻ','ㄹㅂ':'ㄼ','ㄹㅅ':'ㄽ','ㄹㅌ':'ㄾ','ㄹㅍ':'ㄿ','ㄹㅎ':'ㅀ','ㅂㅅ':'ㅄ'};
const VSPLIT = Object.fromEntries(Object.entries(VCOMB).map(([k, v]) => [v, k]));
const CSPLIT = Object.fromEntries(Object.entries(CCOMB).map(([k, v]) => [v, k]));
const isV = j => JUNG.includes(j);

function e2k(text){
  let out = '', cho = '', jung = '', jong = '', lastV = false;
  const flush = () => {
    if (cho && jung) out += String.fromCharCode(0xAC00 + (CHO.indexOf(cho) * 21 + JUNG.indexOf(jung)) * 28 + JONG.indexOf(jong));
    else out += cho + jung + jong;
    cho = jung = jong = ''; lastV = false;
  };
  for (const ch of text){
    const j = KEY[ch] || KEY[ch.toLowerCase()];
    if (!j){ flush(); out += ch; continue; }
    if (isV(j)){
      if (jong){
        const sp = CSPLIT[jong]; let nc;
        if (sp){ jong = sp[0]; nc = sp[1]; } else { nc = jong; jong = ''; }
        flush(); cho = nc; jung = j; lastV = true;
      } else if (jung){
        if (lastV && VCOMB[jung + j]) jung = VCOMB[jung + j];
        else { flush(); jung = j; lastV = true; }
      } else { jung = j; lastV = true; }
    } else {
      lastV = false;
      if (!cho && !jung) cho = j;
      else if (cho && !jung){ flush(); cho = j; }
      else if (!cho && jung){ flush(); cho = j; }
      else if (!jong){ if (JONG.includes(j)) jong = j; else { flush(); cho = j; } }
      else if (CCOMB[jong + j]) jong = CCOMB[jong + j];
      else { flush(); cho = j; }
    }
  }
  flush();
  return out;
}
function k2e(text){
  let out = '';
  const put = j => { const s = VSPLIT[j] || CSPLIT[j]; out += s ? REV[s[0]] + REV[s[1]] : (REV[j] || j); };
  for (const ch of text){
    const c = ch.charCodeAt(0) - 0xAC00;
    if (c >= 0 && c < 11172){
      put(CHO[Math.floor(c / 588)]); put(JUNG[Math.floor((c % 588) / 28)]); if (c % 28) put(JONG[c % 28]);
    } else put(ch);
  }
  return out;
}
let dir = 'auto';
function run(){
  const s = $('src').value;
  const d = dir === 'auto' ? (/[ㄱ-ㅣ가-힣]/.test(s) ? 'k2e' : 'e2k') : dir;
  $('out').value = d === 'e2k' ? e2k(s) : k2e(s);
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
  dir = b.dataset.d; document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b)); run();
});
$('src').addEventListener('input', run);
$('copy').onclick = async () => toast(await copyText($('out').value) ? '복사했습니다.' : '복사하지 못했습니다.');
</script>
</body>
</html>
